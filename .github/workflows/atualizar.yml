name: Atualizar INOVA

on:
  workflow_dispatch:  # permite rodar manualmente
    inputs:
      abas_forcadas:
        description: 'Republicar estas abas mesmo sem STATUS pendente (separadas por vírgula)'
        type: string
        default: ''
  schedule:
    - cron: '0 10 * * *'  # Executa todos os dias às 10:00 UTC

jobs:
  atualizar_wp:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Fazer checkout do repositório
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Configurar Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 3️⃣ Instalar dependências
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4️⃣ Validar a configuração antes de publicar
      #
      # Não bloqueia a publicação (continue-on-error): um aviso sobre uma aba
      # não mapeada não deve impedir a atualização das outras. Se este passo
      # ficar amarelo, abra o log — ele diz exatamente o que está divergente.
      #
      # ⚠️ A validação lê o cabeçalho de todas as abas mapeadas, o que consome
      # boa parte das 60 leituras/minuto que a API do Sheets permite. Por isso
      # o passo seguinte espera a cota renovar antes de publicar.
      #
      # Aqui a validação NÃO bloqueia nem fica vermelha por aba nova (código
      # 2): a publicação das demais abas deve seguir normalmente. Quem avisa
      # sobre aba nova é o workflow "Validar planilha", que roda às 08:00 e
      # fica vermelho para o GitHub notificar.
      - name: Validar planilha (não bloqueia)
        continue-on-error: true
        env:
          GSHEETS_KEY: ${{ secrets.GSHEETS_KEY }}
          GOOGLE_JSON: ${{ secrets.GOOGLE_JSON }}
        run: |
          python validar.py || CODIGO=$?
          if [ "${CODIGO:-0}" = "2" ]; then
            echo "::notice::Há aba nova na planilha esperando decisão. Veja o log acima."
            exit 0
          fi
          exit ${CODIGO:-0}

      # 5️⃣ Salvar o conteúdo atual das páginas ANTES de reescrevê-las
      #
      # A publicação substitui, em cada página, tudo entre o marcador
      # COMECA ATUALIZAR DAQUI e o </table> seguinte. Se o HTML gerado sair
      # errado, o conteúdo anterior se perde — e são páginas publicadas.
      #
      # Salva só as abas listadas em CHECAR ABAS: as que serão reescritas.
      # Consome 2 leituras da planilha (abrir + ler a aba de controle).
      - name: Backup das páginas
        continue-on-error: true
        env:
          GSHEETS_KEY: ${{ secrets.GSHEETS_KEY }}
          GOOGLE_JSON: ${{ secrets.GOOGLE_JSON }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          WP_USER: ${{ secrets.WP_USER }}
        run: python backup_paginas.py

      # Espera a cota da API do Sheets renovar antes de publicar.
      #
      # A API permite 60 leituras por minuto por usuário. A validação sozinha
      # lê o cabeçalho de todas as abas mapeadas e consome quase toda a cota;
      # sem esta pausa, a publicação começa recebendo HTTP 429.
      #
      # O main.py também repete a chamada em caso de 429, mas é melhor não
      # chegar lá: cada retentativa custa mais tempo que esperar aqui.
      - name: Aguardar renovação da cota do Sheets
        run: sleep 65

      # 6️⃣ Publicar
      #
      # abas_forcadas republica uma aba mesmo sem STATUS pendente. Serve para
      # quando a correção está no código, não nos dados: a publicação anterior
      # já zerou o STATUS, e sem isso seria preciso marcar tudo de novo à mão.
      - name: Run script
        env:
          GSHEETS_KEY: ${{ secrets.GSHEETS_KEY }}
          GOOGLE_JSON: ${{ secrets.GOOGLE_JSON }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          WP_USER: ${{ secrets.WP_USER }}
          WP_URL: ${{ secrets.WP_URL }}
          ABAS_FORCADAS: ${{ inputs.abas_forcadas }}
        run: python main.py

      # 7️⃣ Descrever as páginas que ainda não têm descrição
      #
      # Roda DEPOIS da publicação de propósito: a frase é escrita a partir das
      # categorias da tabela, e uma página recém-criada só ganha tabela aqui.
      # Na criação ela está vazia, e não haveria o que descrever.
      #
      # No dia a dia não faz nada — todas as páginas já têm descrição, e o
      # passo só percorre a lista e sai. O modelo só é chamado quando aparece
      # uma página nova.
      #
      # continue-on-error: a descrição é um acréscimo. Se a Groq estiver fora
      # do ar ou a cota tiver acabado, a publicação do dia não pode ficar
      # vermelha por causa disso — a página funciona sem a frase, e a próxima
      # execução tenta de novo.
      - name: Descrever páginas novas
        continue-on-error: true
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          WP_USER: ${{ secrets.WP_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
        run: python gerar_descricoes.py --auto

      # 8️⃣ Publicar o backup como artefato, para download
      #
      # always(): o backup precisa ficar disponível MESMO se a publicação
      # falhar — é justamente nesse caso que ele serve para reverter.
      - name: Guardar backup
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: backup-paginas-${{ github.run_number }}
          path: backups/
          if-no-files-found: warn
          retention-days: 90
