name: Criar páginas no WordPress

# Cria, como RASCUNHO, a página das abas que existem na planilha mas ainda não
# têm página no site — e grava a URL em src/config.py.
#
# As páginas NÃO vão ao ar sozinhas: nascem em rascunho e só aparecem para o
# público quando alguém clicar em "Publicar" no WordPress.
#
# Só roda quando você clica: Actions → "Criar páginas no WordPress" →
# "Run workflow". Não tem agendamento.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Simular (não cria nada, só mostra o que faria)'
        type: boolean
        default: true
      criar_paginas:
        description: 'Criar as páginas que faltam, como rascunho'
        type: boolean
        default: false
      menu_id:
        description: 'ID do menu para inserir as páginas (vazio = não mexe no menu)'
        type: string
        default: ''
      commit:
        description: 'Fazer commit do src/config.py atualizado'
        type: boolean
        default: false
      publicar:
        description: 'Publicar as páginas em rascunho das abas aguardando (tira do rascunho e põe no ar)'
        type: boolean
        default: false
      limpar_menu:
        description: 'Remover do menu os itens que apontam para páginas em rascunho'
        type: boolean
        default: false
      sincronizar_botoes:
        description: 'Acrescentar os botões das 4 abas novas em /startups/ (faz backup antes)'
        type: boolean
        default: false
      corrigir_preambulo:
        description: 'Padronizar CSS das tabelas e campo de busca nas páginas que estão sem'
        type: boolean
        default: false

jobs:
  criar:
    runs-on: ubuntu-latest

    # Necessário para o passo de commit conseguir escrever no repositório.
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Lista os menus do site, para você descobrir o ID a usar no campo
      # menu_id numa execução seguinte.
      - name: Listar menus disponíveis
        continue-on-error: true
        env:
          WP_USER: ${{ secrets.WP_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          GSHEETS_KEY: ${{ secrets.GSHEETS_KEY }}
          GOOGLE_JSON: ${{ secrets.GOOGLE_JSON }}
        run: python sincronizar_config.py --listar-menus

      - name: Sincronizar e criar páginas
        env:
          WP_USER: ${{ secrets.WP_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          GSHEETS_KEY: ${{ secrets.GSHEETS_KEY }}
          GOOGLE_JSON: ${{ secrets.GOOGLE_JSON }}
        run: |
          ARGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          if [ "${{ inputs.criar_paginas }}" = "true" ]; then
            ARGS="$ARGS --criar-paginas"
          fi
          if [ -n "${{ inputs.menu_id }}" ]; then
            ARGS="$ARGS --menu-id ${{ inputs.menu_id }}"
          fi
          echo "Executando: python sincronizar_config.py $ARGS"
          python sincronizar_config.py $ARGS

      # Publica as paginas que estao em rascunho. Vem ANTES da sincronizacao
      # de botoes: o script de botoes ignora paginas nao publicadas, entao a
      # ordem importa para que tudo funcione numa execucao so.
      - name: Publicar páginas em rascunho
        if: ${{ inputs.publicar == true }}
        env:
          WP_USER: ${{ secrets.WP_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          GSHEETS_KEY: ${{ secrets.GSHEETS_KEY }}
          GOOGLE_JSON: ${{ secrets.GOOGLE_JSON }}
        run: |
          ARGS="--publicar ABAS_AGUARDANDO_PAGINA"
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          python sincronizar_config.py $ARGS

      # Um item de menu apontando para pagina em rascunho fica visivel no site
      # e leva o visitante a um 404. Este passo tira esses itens do menu.
      - name: Limpar itens de menu sem página publicada
        if: ${{ inputs.limpar_menu == true }}
        env:
          WP_USER: ${{ secrets.WP_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
        run: |
          MENU="${{ inputs.menu_id }}"
          if [ -z "$MENU" ]; then
            echo "Informe menu_id para limpar o menu."
            exit 1
          fi
          ARGS="--menu-id $MENU"
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          python remover_do_menu.py $ARGS

      # Reescreve a grade de botoes de /startups/. O conteudo anterior e salvo
      # em backups/ e publicado como artefato, para permitir rollback.
      - name: Sincronizar botões de /startups/
        if: ${{ inputs.sincronizar_botoes == true }}
        env:
          WP_USER: ${{ secrets.WP_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
        run: |
          ARGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS="--dry-run"
          fi
          python sincronizar_botoes.py $ARGS

      # O backup fica disponivel para download por 90 dias. Sem isso, o
      # arquivo desapareceria junto com o runner ao fim da execucao.
      - name: Guardar backup da página
        if: ${{ inputs.sincronizar_botoes == true && inputs.dry_run == false }}
        uses: actions/upload-artifact@v4
        with:
          name: backup-startups
          path: backups/
          if-no-files-found: warn
          retention-days: 90

      # O CSS que centraliza as colunas e o campo de busca ficam no conteudo da
      # pagina, ANTES do marcador -- fora do alcance da publicacao. Paginas
      # criadas pela automacao nasciam sem eles.
      - name: Padronizar preâmbulo das páginas
        if: ${{ inputs.corrigir_preambulo == true }}
        env:
          WP_USER: ${{ secrets.WP_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
        run: |
          ARGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            # Na simulacao imprime tambem o preambulo que seria aplicado. E a
            # unica forma de conferir o resultado ANTES de ele ir para o site.
            ARGS="--dry-run --mostrar-modelo"
          fi
          python corrigir_preambulo.py $ARGS

      - name: Commit do config atualizado
        if: ${{ inputs.commit == true && inputs.dry_run == false }}
        run: |
          if git diff --quiet src/config.py; then
            echo "Nenhuma mudança em src/config.py — nada a commitar."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/config.py
          git commit -m "Atualiza ABAS_LINKS com paginas descobertas no WordPress

          Commit automatico gerado por .github/workflows/criar-paginas.yml"
          git push
