name: Capas das páginas

# Escolhe a imagem de capa das páginas que estão sem.
#
# Esta versao SO ANALISA. Nada e enviado ao site nem a biblioteca de midia --
# as imagens escolhidas saem como ARTEFATO, para voce baixar e olhar. A
# gravacao entra depois, quando estes resultados tiverem sido conferidos.
#
# O caminho: categorias da pagina -> termo de busca em ingles -> Pexels ->
# descarte das pequenas -> NSFW, relevancia (CLIP) e rostos -> recorte 3:1.
#
# Precisa dos Secrets:
#   PEXELS_API_KEY   https://www.pexels.com/api/
#   GROQ_API_KEY     https://console.groq.com
#   WP_USER / WP_APP_PASSWORD  (so para LER quais paginas estao sem capa)

on:
  workflow_dispatch:
    inputs:
      analisar:
        description: 'Etapa 1 — buscar e analisar as capas (não toca no site)'
        type: boolean
        default: true
      aplicar:
        description: 'Etapa 2 — gravar no site as capas de capas.json'
        type: boolean
        default: false
      dry_run:
        description: 'Com "aplicar": mostrar o que faria, sem gravar'
        type: boolean
        default: true
      repadronizar:
        description: 'Repadronizar as capas JÁ EXISTENTES para 3:1 (usa "dry_run" também)'
        type: boolean
        default: false
      legendar:
        description: 'Escrever o alt olhando a imagem (vazio em "abas" = só as que estão sem alt)'
        type: boolean
        default: false
      refazer_alt:
        description: 'Reescrever só o texto alternativo (exige "abas")'
        type: boolean
        default: false
      substituir:
        description: 'Com "Etapa 1": trocar a capa de páginas que JÁ têm uma (exige "abas")'
        type: boolean
        default: false
      abas:
        description: 'Limitar a estas abas (separadas por vírgula; vazio = todas as sem capa)'
        type: string
        default: ''
      limite:
        description: 'Máximo de candidatas a baixar por página'
        type: string
        default: '8'
      modelo:
        description: 'Modelo da Groq (vazio = o padrão do código)'
        type: string
        default: ''

jobs:
  capas:
    runs-on: ubuntu-latest

    # Necessário para commitar o capas.json.
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Os modelos do CLIP e do NSFW somam ~700 MB e sao baixados na primeira
      # execucao. O cache evita rebaixa-los a cada rodada.
      - name: Cache dos modelos de visão
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ hashFiles('requirements-visao.txt') }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-visao.txt

      - name: Etapa 1 — analisar capas
        if: ${{ inputs.analisar == true }}
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          WP_USER: ${{ secrets.WP_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
        run: |
          ARGS="--analisar --limite ${{ inputs.limite }}"
          if [ "${{ inputs.substituir }}" = "true" ]; then
            ARGS="$ARGS --substituir"
          fi
          if [ -n "${{ inputs.abas }}" ]; then
            ARGS="$ARGS --abas ${{ inputs.abas }}"
          fi
          if [ -n "${{ inputs.modelo }}" ]; then
            ARGS="$ARGS --modelo ${{ inputs.modelo }}"
          fi
          python gerar_capas.py $ARGS

      # O capas.json registra a escolha, a procedencia e a licenca de cada foto,
      # e e dele que a Etapa 2 trabalha -- por isso vai para o repositorio, ao
      # contrario das imagens, que saem como artefato.
      - name: Commit das escolhas
        if: ${{ inputs.analisar == true }}
        run: |
          if [ ! -f capas.json ]; then
            echo "capas.json não foi gerado — nada a commitar."
            exit 0
          fi
          git add capas.json
          if git diff --cached --quiet -- capas.json; then
            echo "capas.json sem mudanças — nada a commitar."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Capas escolhidas pela Action

          Cada entrada traz a foto, o autor, a licenca e as notas da analise."
          git push

      - name: Etapa 2 — aplicar capas
        if: ${{ inputs.aplicar == true }}
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          WP_USER: ${{ secrets.WP_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
        run: |
          ARGS="--aplicar"
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          python gerar_capas.py $ARGS

      # Recorta as capas que ja existem. A foto e a mesma; muda o
      # enquadramento. A midia antiga fica intacta na biblioteca.
      - name: Repadronizar capas existentes
        if: ${{ inputs.repadronizar == true }}
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          WP_USER: ${{ secrets.WP_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
        run: |
          ARGS="--repadronizar"
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          if [ -n "${{ inputs.abas }}" ]; then
            ARGS="$ARGS --abas ${{ inputs.abas }}"
          fi
          python gerar_capas.py $ARGS

      # Reescreve so o alt. Separado porque a repadronizacao e idempotente
      # pelo nome do arquivo: pagina ja padronizada e sempre pulada, e um alt
      # ruim ficaria la para sempre.
      - name: Reescrever texto alternativo
        if: ${{ inputs.refazer_alt == true }}
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          WP_USER: ${{ secrets.WP_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
        run: |
          ARGS="--refazer-alt --abas ${{ inputs.abas }}"
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          python gerar_capas.py $ARGS

      # Le a imagem publicada com um modelo de visao e escreve o alt. O log
      # traz a URL de cada imagem, para a conferencia ser um clique.
      - name: Legendar capas com visão computacional
        if: ${{ inputs.legendar == true }}
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          WP_USER: ${{ secrets.WP_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
        run: |
          ARGS="--legendar"
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          if [ -n "${{ inputs.abas }}" ]; then
            ARGS="$ARGS --abas ${{ inputs.abas }}"
          fi
          python gerar_capas.py $ARGS

      # O artefato e o ponto do exercicio: e assim que voce ve as imagens que
      # o modelo escolheu, antes de qualquer uma ir para o site.
      - name: Publicar as capas escolhidas
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: capas-propostas
          path: capas/
          if-no-files-found: warn
          retention-days: 90
